[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "placeholder-chipset"
version = "0.1.0"
description = "Chipset — an instruction set and execution engine for composable programs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "jsonschema>=4.18",
]

# The distribution name (placeholder-chipset) does not match the import name
# (chipset), so hatchling cannot auto-detect the src layout.
[tool.hatch.build.targets.wheel]
packages = ["src/chipset"]
artifacts = ["src/chipset/**/*.schema.json"]
